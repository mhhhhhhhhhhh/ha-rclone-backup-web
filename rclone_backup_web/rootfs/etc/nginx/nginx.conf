user root;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    # Only accept the path syntax generated by the HA ingress gateway.
    map $http_x_ingress_path $ha_base {
        default "";
        ~^(/api/hassio_ingress/[A-Za-z0-9_-]+)/?$ $1;
    }
    server {
        listen 8099;
        server_name _;
        allow 172.30.32.2;
        deny all;
        root /usr/share/rclone-web;
        index index.html;
        client_max_body_size 0;
        add_header Referrer-Policy no-referrer always;
        if ($ha_base = "") { return 400; }

        location /rc/ {
            # Avoid request-URL details in nginx upstream error logs.
            error_log /dev/null;
            proxy_pass http://127.0.0.1:5573/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header Origin "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
        # Downloads use temporary rclone HTTP servers bound to loopback only.
        location ~ "^/serve/(?<serve_port>[0-9]{1,5})(?<serve_path>/.*)$" {
            proxy_pass http://127.0.0.1:$serve_port$serve_path$is_args$args;
            proxy_set_header Host localhost;
            proxy_set_header Origin "";
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
        location /assets/ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
        location = /index.html {
            sub_filter_once off;
            sub_filter '__HA_BASE_PLACEHOLDER__' '$ha_base';
            add_header Cache-Control 'no-store';
        }
    }
}
