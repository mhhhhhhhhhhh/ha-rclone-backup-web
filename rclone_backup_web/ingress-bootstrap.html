<base href="__HA_BASE_PLACEHOLDER__/">
<script>
(function () {
  const prefix = "__HA_BASE_PLACEHOLDER__";
  window.__HA_INGRESS_PATH__ = prefix;
  const key = 'ha-rclone-web-auth';
  let previous = {};
  try { previous = JSON.parse(localStorage.getItem(key) || '{}').state || {}; } catch (_) {}
  const state = {
    ...previous,
    url: location.origin + prefix + '/rc',
    user: '',
    pass: ''
  };
  localStorage.setItem(key, JSON.stringify({state, version: 0}));

  // Keep config credentials/code out of browser request URLs, including SDK edits.
  const originalFetch=window.fetch.bind(window);
  window.fetch=async function(input,init) {
    const req=new Request(input,init);
    const target=new URL(req.url,location.href);
    const rcPrefix=prefix+'/rc/config/';
    if (target.origin===location.origin && target.pathname.startsWith(rcPrefix) && req.method==='POST' && target.search) {
      const data={};
      target.searchParams.forEach((value,key)=>{data[key]=value;});
      for (const key of ['parameters','opt']) {
        if (typeof data[key]==='string') { try {data[key]=JSON.parse(data[key]);} catch (_) {} }
      }
      if (req.headers.get('content-type')?.includes('application/json')) {
        try {Object.assign(data,await req.clone().json());} catch (_) {}
      }
      target.search='';
      const headers=new Headers(req.headers);headers.set('Content-Type','application/json');
      return originalFetch(target.href,{method:'POST',headers,body:JSON.stringify(data),signal:req.signal,credentials:req.credentials,cache:'no-store'});
    }
    return originalFetch(req);
  };

})();
</script>
