name: Rclone Backup Web
version: 1.1.0
slug: rclone_backup_web
description: Home Assistant backup scheduler with the new official Rclone Web UI
arch:
- aarch64
- amd64
- armhf
- armv7
- i386
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
map:
- homeassistant_config:rw
- addon_config:rw
- backup:rw
- media:rw
- share:rw
- ssl:ro
devices:
- /dev/fuse
privileged:
- SYS_ADMIN
apparmor: false
options:
  jobs: []
  dry_run: true
  config_path: /homeassistant/rclone.conf
schema:
  jobs:
  - name: str?
    schedule: str?
    command: str
    source: str?
    sources:
    - str?
    destination: str?
    destinations:
    - str?
    include:
    - str?
    exclude:
    - str?
    flags: str?
    extra_flags:
    - str?
  dry_run: bool?
  flags: str?
  extra_flags:
  - str?
  run_once: bool?
  config_path: str?
  rclone_config: str?
  no_rename: bool?
  no_unrename: bool?
  no_slugify: bool?
  no_events: bool?
  log_level: list(debug|info|warning|error|fatal)?
  gui_user: str?
  gui_password: password?
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:cloud-sync
panel_title: Rclone
panel_admin: true
